services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sofia}
      POSTGRES_USER: ${POSTGRES_USER:-sofia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sofia_dev}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
  api:
    build: ./apps/api
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sofia}:${POSTGRES_PASSWORD:-sofia_dev}@postgres:5432/${POSTGRES_DB:-sofia}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,https://sofia.2ads.com.br
    ports: ["8000:8000"]
    volumes: [./apps/api/app:/app/app]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment: {CHOKIDAR_USEPOLLING: "true"}
    ports: ["5173:5173"]
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
  web_node_modules:
